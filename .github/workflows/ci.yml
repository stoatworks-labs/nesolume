name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive
          # tools/compat.py builds the previous release's harness from its tag.
          fetch-depth: 0

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # NESOLUME_BUILD_TOOLS is ON here where the release build turns it OFF:
        # netest is a large slice of the C++ and the only place the plugin's
        # maths is written down twice, so compiling it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DNESOLUME_BUILD_TOOLS=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel
          cmake --build build --config Release --parallel --target netest_insert

      - name: Parameters
        # No GL: the table, the Resolume addresses, the glitch clock, and the
        # HAM encoder against exhaustive search.
        run: |
          ./build/netest --names
          ./build/netest --params
          ./build/netest --glitch
          ./build/netest --ham-optimal

      - name: The Amiga
        # The runner has no accelerated GL. NETEST_RENDERER=software asks for
        # Apple's software renderer outright, so a local run of the same line
        # reproduces this step exactly. 320x180; verify.sh runs them at
        # 1280x1024 on the GPU too.
        timeout-minutes: 20
        env:
          NETEST_RENDERER: software
        run: |
          ./build/netest --ham-edge --size 320x180
          ./build/netest --ehb      --size 320x180
          ./build/netest --palette  --size 320x180
          ./build/netest --lace     --size 320x180
          ./build/netest --negative --size 320x180

      - name: Compatibility with the previous release
        # Every existing console byte-identical to the last tag's own harness,
        # rendered here on the same renderer, and the old parameter table
        # unchanged. The negative control inserts the Amiga mid-list and must
        # fail.
        timeout-minutes: 20
        env:
          NETEST_RENDERER: software
        run: |
          python3 tools/compat.py --size 320x180 --jobs 2
          python3 tools/compat.py --negative --size 320x180 --jobs 2

      - name: Controls
        # 1280x960, because the pixel grid fades out below ~2 output pixels a
        # raster pixel and would read dead at a smaller size.
        timeout-minutes: 20
        env:
          NETEST_RENDERER: software
        run: python3 tools/sweep.py --jobs 2

      - name: Pipe
        # A reader that goes away must get exit 1, not SIGPIPE's silent 141.
        run: |
          set +e
          head -c $(( 64 * 36 * 4 * 8 )) /dev/zero | ./build/netest --pipe --width 64 --height 36 2>/dev/null | head -c 1 >/dev/null
          status=${PIPESTATUS[1]}
          echo "netest --pipe exit $status"
          test "$status" -eq 1

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: nesolume-macos-arm64
          path: build/*.bundle
          if-no-files-found: error
