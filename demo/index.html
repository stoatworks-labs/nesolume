  <body>
    <main id="demo">
      <noscript>
        <h1>NESolume</h1>
        <p>
          Retro console video hardware as an FFGL effect: a real machine's
          raster, palette and attribute cells, plus scroll-register distortion
          and glitches that corrupt the indices, so even a machine in the middle
          of falling over never shows a colour outside its palette. Now with the
          Amiga: 12-bit registers, Extra Half-Brite and an exact HAM6 encoder.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/nesolume/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/nesolume/">Project page and downloads</a></li>

        </ul>
      </noscript>
